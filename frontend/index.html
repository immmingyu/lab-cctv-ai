<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연구실 지능형 CCTV</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Malgun Gothic",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  h1 { margin:0; font-size:20px; }
  #status { font-size:13px; color:var(--muted); }
  .wrap { max-width:900px; margin:0 auto; padding:20px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .stat { background:var(--card); border-radius:10px; padding:14px; text-align:center; }
  .stat b { display:block; font-size:26px; }
  .stat span { font-size:12px; color:var(--muted); }
  .filters { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .filters button { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:999px; padding:6px 14px; cursor:pointer; font-size:13px; }
  .filters button.active { background:#3b82f6; border-color:#3b82f6; }
  .event { background:var(--card); border-left:5px solid #22c55e; border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .event.MEDIUM { border-left-color:#f59e0b; }
  .event.HIGH, .event.CRITICAL { border-left-color:#ef4444; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .type { font-weight:700; }
  .badge { font-size:12px; font-weight:700; padding:2px 10px; border-radius:999px; background:#22c55e; color:#052e16; }
  .badge.MEDIUM { background:#f59e0b; color:#451a03; }
  .badge.HIGH, .badge.CRITICAL { background:#ef4444; color:#fff; }
  .summary { margin:8px 0 6px; font-size:14px; }
  .meta { font-size:12px; color:var(--muted); }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  .snap { display:block; width:100%; max-width:360px; border-radius:8px; margin-top:10px; cursor:zoom-in; border:1px solid var(--line); }
  .ai { margin:8px 0; padding:10px 12px; background:#0b1220; border:1px solid var(--line); border-radius:8px; font-size:14px; line-height:1.6; }
  .chat { background:var(--card); border-radius:10px; padding:14px 16px; margin-bottom:16px; }
  .chat-row { display:flex; gap:8px; }
  .chat input { flex:1; background:#0b1220; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:14px; }
  .chat .send { background:#3b82f6; color:#fff; border:none; border-radius:8px; padding:0 16px; cursor:pointer; font-size:14px; }
  .chat .send:disabled { opacity:.5; cursor:default; }
  .examples { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .examples button { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:12px; cursor:pointer; }
  .answer { margin-top:12px; white-space:pre-wrap; font-size:14px; line-height:1.6; }
  .answer:empty { display:none; }

  /* 실시간 알림 배너 */
  #alerts { position:sticky; top:0; z-index:50; display:flex; flex-direction:column; gap:8px; padding:0 20px; max-width:900px; margin:0 auto; }
  #alerts:empty { display:none; }
  .alert { display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:10px; font-size:15px; font-weight:700; color:#fff; box-shadow:0 6px 18px rgba(0,0,0,.45); animation:slide .25s ease-out; }
  .alert.high { background:#dc2626; }
  .alert.high.blink { animation:slide .25s ease-out, blink 1s ease-in-out 3; }
  .alert.medium { background:#d97706; }
  .alert.low { background:#2563eb; }
  .alert .when { font-weight:400; font-size:13px; opacity:.85; }
  .alert .x { margin-left:auto; background:transparent; border:none; color:#fff; font-size:18px; cursor:pointer; line-height:1; padding:0 4px; }
  @keyframes slide { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:none; } }
  @keyframes blink { 50% { filter:brightness(1.55); } }
  /* 알림 켜기 버튼 (브라우저는 사용자가 한 번 누르기 전에는 소리를 막는다) */
  #sound { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:999px; padding:6px 14px; cursor:pointer; font-size:13px; }
  #sound.on { background:#166534; border-color:#166534; }
  header .right { display:flex; align-items:center; gap:12px; }
  /* 전시회용 알림 설정 (기본값은 서버 .env, 여기서 바꾼 값은 새로고침하면 기본값으로 돌아감) */
  .opts { display:flex; gap:10px; font-size:12px; color:var(--muted); }
  .opts label { display:flex; align-items:center; gap:4px; cursor:pointer; white-space:nowrap; }
</style>
</head>
<body>
<header>
  <h1>🎥 연구실 지능형 CCTV</h1>
  <div class="right">
    <div class="opts" title="기본값은 서버 .env (DASHBOARD_EXTRA_SOUND, DASHBOARD_LOW_BANNER). 여기서 바꾼 값은 새로고침하면 기본값으로 돌아갑니다">
      <label><input type="checkbox" id="opt-extra-sound">구역·물건 소리</label>
      <label><input type="checkbox" id="opt-low-banner">물건 이동 배너</label>
    </div>
    <button id="sound" title="브라우저는 한 번 눌러 허용하기 전에는 소리를 막습니다">🔕 알림 켜기</button>
    <div id="status">연결 중...</div>
  </div>
</header>

<div id="alerts"></div>

<div class="wrap">
  <div class="stats">
    <div class="stat"><b id="s-all">0</b><span>전체 이벤트</span></div>
    <div class="stat"><b id="s-fall">0</b><span>낙상 감지</span></div>
    <div class="stat"><b id="s-intr">0</b><span>제한 구역 접근</span></div>
    <div class="stat"><b id="s-disp">0</b><span>물건 이동</span></div>
  </div>

  <div class="chat">
    <div class="chat-row">
      <input id="q" placeholder="CCTV에 질문해보세요. 예: 오늘 연구실에서 이상한 일 있었어?">
      <button class="send" id="ask">질문</button>
    </div>
    <div class="examples" id="examples"></div>
    <div class="answer" id="answer"></div>
  </div>

  <div class="filters" id="filters"></div>
  <div id="list"></div>
</div>

<script>
const TYPE_LABEL = {
  fall_detection: "🚨 낙상 감지",
  restricted_area_intrusion: "⛔ 제한 구역 접근",
  object_displacement: "📦 물건 이동",
};
const FILTERS = [["", "전체"], ["fall_detection", "낙상"], ["restricted_area_intrusion", "제한 구역"], ["object_displacement", "물건 이동"]];
const EXAMPLES = [
  "오늘 연구실에서 이상한 일 있었어?",
  "오늘 가장 위험했던 상황은 뭐야?",
  "제한 구역에 누가 들어온 적 있어?",
  "물건이 이동한 적 있어?",
];

let allEvents = [];
let currentFilter = "";
let lastJson = "";

/* ---------- 실시간 알림 ---------- */
const seenIds = new Set();   // 이미 본 이벤트 id
let firstLoad = true;        // 첫 조회는 "이미 있던 기록"이므로 알리지 않는다
let audioCtx = null;         // 사용자가 버튼을 누른 뒤에만 만들어진다
// 전시회용 알림 설정. 기본은 둘 다 꺼짐(예전과 같음), 서버 .env 값을 /alert-config 로 받아 덮어쓴다
const alertOpts = { extra_sound: false, low_banner: false };

async function setupAlertOptions() {
  const sound = document.getElementById("opt-extra-sound");
  const low = document.getElementById("opt-low-banner");
  try {
    const res = await fetch("/alert-config");
    if (res.ok) {
      const cfg = await res.json();
      alertOpts.extra_sound = cfg.extra_sound === true;
      alertOpts.low_banner = cfg.low_banner === true;
    }
  } catch (e) {
    console.error(e);   // 못 읽으면 예전 동작(둘 다 꺼짐) 그대로
  }
  sound.checked = alertOpts.extra_sound;
  low.checked = alertOpts.low_banner;
  sound.onchange = () => {
    alertOpts.extra_sound = sound.checked;
    if (sound.checked) {   // 두 소리를 미리 듣기: 딩-동(제한 구역) 다음 띵(물건 이동). "알림 켜기"를 누른 뒤에만 들림
      chime("restricted_area_intrusion");
      setTimeout(() => chime("object_displacement"), 700);
    }
  };
  low.onchange = () => { alertOpts.low_banner = low.checked; };
}

function setupSound() {
  const btn = document.getElementById("sound");
  btn.onclick = async () => {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();   // 사용자가 누른 이 순간에만 소리가 허용된다
      beep(0.05);                // 아주 짧게 울려서 들리는지 확인
      btn.textContent = "🔔 알림 켜짐";
      btn.classList.add("on");
    } catch (e) {
      console.error(e);
      btn.textContent = "🔕 소리를 켤 수 없음";
    }
  };
}

// 짧은 경고음 (음원 파일 없이 브라우저가 직접 소리를 만든다)
function beep(seconds = 0.18, freq = 880, type = "square", volume = 0.25) {
  if (!audioCtx || audioCtx.state !== "running") return;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(volume, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + seconds);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + seconds + 0.02);
}

function alarm() {   // HIGH: 삐- 삐- 삐- 세 번
  [0, 300, 600].forEach(ms => setTimeout(() => beep(0.18), ms));
}

// 전시회용 가벼운 소리 (HIGH 경고음인 사각파 세 번보다 부드러운 사인파·삼각파 한두 음)
function chime(eventType) {
  if (eventType === "restricted_area_intrusion") {   // 딩-동 두 번
    beep(0.12, 660, "sine", 0.18);
    setTimeout(() => beep(0.16, 520, "sine", 0.18), 150);
  } else {                                           // 물건 이동: 띵 한 번
    // 예전 값(사인파 0.1초, 볼륨 0.12)은 바로 줄어들어 실제로 들리는 시간이 약 30ms라 노트북 스피커에서 거의 안 들렸다.
    // 삼각파로 조금 또렷하게, 길이와 볼륨을 늘림. 여전히 HIGH(사각파 세 번)보다 가볍고, 딩-동(두 음)과도 구분된다.
    beep(0.35, 988, "triangle", 0.22);
  }
}

function showBanner(ev, level) {
  const box = document.getElementById("alerts");
  const bar = el("div", "alert " + level + (level === "high" ? " blink" : ""));
  const label = TYPE_LABEL[ev.event_type] || ev.event_type;
  const prefix = { high: "🚨 긴급: ", medium: "⚠️ 주의: ", low: "ℹ️ 알림: " }[level];
  bar.appendChild(el("span", "", prefix + label + " - " + ev.summary));
  bar.appendChild(el("span", "when", fmtTime(ev)));
  const x = el("button", "x", "×");
  x.onclick = () => bar.remove();
  bar.appendChild(x);
  box.prepend(bar);
  while (box.children.length > 3) box.lastChild.remove();   // 배너는 최대 3개
  if (level === "medium") setTimeout(() => bar.remove(), 15000);   // 주황은 저절로 사라짐
  if (level === "low") setTimeout(() => bar.remove(), 10000);      // 파랑(물건 이동)은 더 빨리 사라짐
}

function checkNewEvents(events) {
  if (firstLoad) {
    events.forEach(e => seenIds.add(e.id));
    firstLoad = false;
    return;
  }
  // 오래된 것부터 처리해야 배너 순서가 시간순이 된다
  const fresh = events.filter(e => !seenIds.has(e.id)).reverse();
  fresh.forEach(e => seenIds.add(e.id));

  const high = fresh.filter(e => e.risk === "HIGH" || e.risk === "CRITICAL");
  const medium = fresh.filter(e => e.risk === "MEDIUM");
  const low = fresh.filter(e => e.risk === "LOW");
  if (alertOpts.low_banner) low.forEach(e => showBanner(e, "low"));   // 파랑 배너 (설정 켰을 때만)
  medium.forEach(e => showBanner(e, "medium"));          // 주황 배너, 소리 없음
  high.forEach(e => showBanner(e, "high"));              // 빨간 배너
  if (high.length > 0) {
    alarm();                                             // 소리는 한 번만
  } else if (alertOpts.extra_sound) {
    // HIGH가 없을 때만 가벼운 소리 한 번 (제한 구역이 물건 이동보다 우선)
    const types = fresh.map(e => e.event_type);
    if (types.includes("restricted_area_intrusion")) chime("restricted_area_intrusion");
    else if (types.includes("object_displacement")) chime("object_displacement");
  }
}

function fmtTime(ev) {
  const d = new Date(ev.timestamp);
  if (!isNaN(d)) return d.toLocaleString("ko-KR");
  const c = new Date(ev.created_at);
  return isNaN(c) ? ev.timestamp : c.toLocaleString("ko-KR");
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

/* ---------- 이벤트 목록 ---------- */
function renderFilters() {
  const box = document.getElementById("filters");
  box.innerHTML = "";
  FILTERS.forEach(([value, label]) => {
    const b = el("button", value === currentFilter ? "active" : "", label);
    b.onclick = () => { currentFilter = value; renderFilters(); render(); };
    box.appendChild(b);
  });
}

function render() {
  const count = t => allEvents.filter(e => e.event_type === t).length;
  document.getElementById("s-all").textContent = allEvents.length;
  document.getElementById("s-fall").textContent = count("fall_detection");
  document.getElementById("s-intr").textContent = count("restricted_area_intrusion");
  document.getElementById("s-disp").textContent = count("object_displacement");

  const list = document.getElementById("list");
  list.innerHTML = "";
  const shown = allEvents.filter(e => !currentFilter || e.event_type === currentFilter);
  if (shown.length === 0) { list.appendChild(el("div", "empty", "아직 이벤트가 없습니다.")); return; }

  shown.forEach(ev => {
    const card = el("div", "event " + ev.risk);
    const top = el("div", "row");
    top.appendChild(el("span", "type", TYPE_LABEL[ev.event_type] || ev.event_type));
    top.appendChild(el("span", "badge " + ev.risk, ev.risk));
    card.appendChild(top);
    card.appendChild(el("div", "summary", ev.summary));
    if (ev.llm_summary) {
      card.appendChild(el("div", "ai", "🤖 " + ev.llm_summary));
    }
    card.appendChild(el("div", "meta",
      `${fmtTime(ev)} · ${ev.object} · ${ev.location} · 신뢰도 ${ev.confidence} · ${ev.duration_seconds}초`));

    if (ev.clip_path && ev.clip_path.startsWith("snapshots/")) {
      const img = el("img", "snap");
      img.src = "/" + ev.clip_path;
      img.alt = "이벤트 스냅샷";
      img.loading = "lazy";
      img.onclick = () => window.open(img.src, "_blank");
      card.appendChild(img);
    }
    list.appendChild(card);
  });
}

async function load() {
  const status = document.getElementById("status");
  try {
    const res = await fetch("/events?limit=200");
    const text = await res.text();
    if (text !== lastJson) {
      lastJson = text;
      allEvents = JSON.parse(text);
      checkNewEvents(allEvents);
      render();
    }
    status.textContent = "● 실시간 연결됨 · " + new Date().toLocaleTimeString("ko-KR");
  } catch (e) {
    console.error(e);
    status.textContent = "○ 서버 연결 실패";
  }
}

/* ---------- 자연어 질문 ---------- */
async function ask(question) {
  question = question.trim();
  if (!question) return;
  const btn = document.getElementById("ask");
  const answer = document.getElementById("answer");
  btn.disabled = true;
  answer.textContent = "🤖 기록을 확인하는 중...";
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
        answer.textContent = `🤖 ${data.answer}\n\n(${data.scope} 이벤트 ${data.event_count}건 기준)`;
  } catch (e) {
    console.error(e);
    answer.textContent = "질문 처리에 실패했습니다. 서버를 확인해주세요.";
  } finally {
    btn.disabled = false;
  }
}

function setupChat() {
  const input = document.getElementById("q");
  document.getElementById("ask").onclick = () => ask(input.value);
  input.addEventListener("keydown", e => {
    // isComposing: 한글 입력 조합 중에 Enter가 두 번 처리되는 문제 방지
    if (e.key === "Enter" && !e.isComposing) ask(input.value);
  });
  const box = document.getElementById("examples");
  EXAMPLES.forEach(text => {
    const b = el("button", "", text);
    b.onclick = () => { input.value = text; ask(text); };
    box.appendChild(b);
  });
}

/* ---------- 시작 ---------- */
setupChat();
setupSound();
setupAlertOptions();
renderFilters();
load();
setInterval(load, 2000);
</script>
</body>
</html>
